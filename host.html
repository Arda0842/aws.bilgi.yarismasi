<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Quiz - Host</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Google Sans', sans-serif; }
        .google-gradient { background: linear-gradient(135deg, #4285F4 0%, #34A853 33%, #FBBC05 66%, #EA4335 100%); }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .curtain { transition: width 1.5s cubic-bezier(0.25, 1, 0.5, 1); }
        .curtain-texture {
            background-color: #8B0000;
            background-image: repeating-linear-gradient(to right, #3e0000 0px, #8B0000 20px, #b00000 40px, #8B0000 60px, #3e0000 80px);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col text-gray-800 overflow-hidden text-left">

    <div id="curtainLeft" class="fixed top-0 left-0 w-0 h-full z-[100] curtain curtain-texture border-r-[12px] border-yellow-500"></div>
    <div id="curtainRight" class="fixed top-0 right-0 w-0 h-full z-[100] curtain curtain-texture border-l-[12px] border-yellow-500"></div>
    <div id="curtainContent" class="fixed inset-0 z-[101] flex flex-col items-center justify-center opacity-0 transition-opacity duration-1000 delay-1000 pointer-events-none text-center">
        <h1 class="text-5xl md:text-7xl font-black text-white mb-10 drop-shadow-2xl">Etkinliğe katılımınız için<br><span class="text-yellow-400">teşekkürler!</span></h1>
        <div class="bg-white p-8 rounded-[2rem] flex flex-col items-center shadow-2xl">
            <img src="logo.png" class="h-28 w-auto mb-4 object-contain">
            <h2 class="text-3xl font-black text-gray-800">AWS <span class="text-blue-600">Kayseri Üniversitesi</span></h2>
        </div>
    </div>

    <header class="bg-white border-b-4 border-blue-500 shadow-sm py-4 px-10 flex justify-between items-center z-10 shrink-0">
        <img src="logo.png" class="h-12 w-auto object-contain">
        <h1 class="text-3xl font-black text-gray-800 tracking-tight">AWS <span class="text-blue-600">Kayseri Üniversitesi</span></h1>
        <div class="bg-gray-100 px-6 py-1 rounded-2xl border-2 border-gray-200">
            <p class="text-[10px] font-bold uppercase text-gray-500">Oyun PIN</p>
            <p class="text-3xl font-black text-blue-600 leading-none" id="headerPin">----</p>
        </div>
    </header>

    <main id="mainContent" class="flex-grow flex flex-col items-center justify-center p-6 relative overflow-hidden w-full">
        <div id="lobbyArea" class="w-full max-w-7xl flex gap-10 h-full items-stretch">
            <div class="w-1/2 flex flex-col items-center justify-center bg-white p-10 rounded-[3rem] shadow-2xl border relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-3 google-gradient"></div>
                <h2 class="text-4xl font-black mb-8 text-gray-700">Mücadele Başlıyor!</h2>
                <div class="bg-gray-50 px-12 py-6 rounded-3xl text-center border-2 mb-8 shadow-inner w-full">
                    <p class="text-[6rem] leading-none font-black text-blue-600 tracking-tighter" id="displayPin">----</p>
                </div>
                <div class="p-6 bg-white rounded-3xl shadow-lg border-4 border-blue-50 text-center animate-pop">
                    <p class="text-lg font-black text-gray-400 mb-3 uppercase tracking-widest">Kameranı Okut</p>
                    <img src="qr.jpg" alt="QR" class="w-60 h-60 object-contain mx-auto rounded-xl">
                </div>
            </div>
            <div class="w-1/2 flex flex-col bg-white p-8 rounded-[3rem] shadow-xl border relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-3 bg-blue-500"></div>
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <h3 class="text-3xl font-black text-gray-700">Katılımcılar</h3>
                    <p id="playerCountTag" class="text-xl font-bold text-white bg-blue-600 px-6 py-2 rounded-2xl">0 Kişi</p>
                </div>
                <div id="playerList" class="flex flex-wrap content-start gap-3 w-full overflow-y-auto h-full custom-scrollbar pr-2"></div>
            </div>
        </div>

        <div id="questionArea" class="hidden w-full max-w-6xl mx-auto flex flex-col items-center animate-pop">
            <div id="timerCircle" class="w-28 h-28 bg-white rounded-full flex items-center justify-center shadow-2xl mb-6 border-[6px] border-blue-500 ring-8 ring-blue-50/50 text-4xl font-black text-blue-600">
                <span id="timerText">5</span>
            </div>
            <div class="bg-white text-gray-800 w-full p-12 rounded-[2.5rem] shadow-2xl mb-10 text-center border">
                <h2 id="questionText" class="text-5xl font-bold leading-tight"></h2>
            </div>
            <div class="grid grid-cols-2 gap-6 w-full" id="optionsGrid">
                <div id="box0" class="relative bg-[#EA4335] rounded-3xl p-8 flex justify-between items-center shadow-lg border-b-8 border-red-700">
                    <span id="opt0" class="text-white text-3xl font-bold pr-4"></span>
                    <span id="count0" class="hidden text-white text-3xl font-black bg-black/20 px-5 py-2 rounded-2xl">0 Kişi</span>
                </div>
                <div id="box1" class="relative bg-[#4285F4] rounded-3xl p-8 flex justify-between items-center shadow-lg border-b-8 border-blue-700">
                    <span id="opt1" class="text-white text-3xl font-bold pr-4"></span>
                    <span id="count1" class="hidden text-white text-3xl font-black bg-black/20 px-5 py-2 rounded-2xl">0 Kişi</span>
                </div>
                <div id="box2" class="relative bg-[#FBBC05] rounded-3xl p-8 flex justify-between items-center shadow-lg border-b-8 border-yellow-600">
                    <span id="opt2" class="text-white text-3xl font-bold pr-4"></span>
                    <span id="count2" class="hidden text-white text-3xl font-black bg-black/20 px-5 py-2 rounded-2xl">0 Kişi</span>
                </div>
                <div id="box3" class="relative bg-[#34A853] rounded-3xl p-8 flex justify-between items-center shadow-lg border-b-8 border-green-700">
                    <span id="opt3" class="text-white text-3xl font-bold pr-4"></span>
                    <span id="count3" class="hidden text-white text-3xl font-black bg-black/20 px-5 py-2 rounded-2xl">0 Kişi</span>
                </div>
            </div>
        </div>

        <div id="scoreboardArea" class="hidden w-full max-w-3xl bg-white p-12 rounded-[3rem] shadow-2xl border text-center animate-pop">
            <h2 class="text-4xl font-black text-gray-700 uppercase mb-8 italic">Liderlik Tablosu</h2>
            <div id="scoreList" class="space-y-4"></div>
        </div>

        <div id="winnerArea" class="hidden w-full max-w-5xl bg-white p-12 rounded-[3rem] shadow-2xl border-4 border-yellow-400 text-center animate-pop flex flex-col items-center">
            <h2 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600 mb-8">🏆 TEBRİKLER 🏆</h2>
            <div class="flex items-end justify-center gap-4 w-full h-80">
                <div id="place2" class="hidden flex-col items-center w-1/3 h-[70%]">
                    <p id="name2" class="text-2xl font-bold truncate w-full px-2"></p>
                    <div class="w-full bg-gray-200 rounded-t-3xl h-full flex justify-center pt-6 border-t-8 border-gray-400"><span class="text-6xl font-black text-gray-500">2</span></div>
                </div>
                <div id="place1" class="flex flex-col items-center w-1/3 h-full z-10">
                    <p id="name1" class="text-4xl font-black truncate w-full px-2"></p>
                    <div class="w-full bg-yellow-300 rounded-t-3xl h-full flex justify-center pt-6 border-t-8 border-yellow-500 shadow-2xl transform scale-105"><span class="text-8xl font-black text-yellow-100">1</span></div>
                </div>
                <div id="place3" class="hidden flex-col items-center w-1/3 h-[50%]">
                    <p id="name3" class="text-2xl font-bold truncate w-full px-2"></p>
                    <div class="w-full bg-orange-200 rounded-t-3xl h-full flex justify-center pt-6 border-t-8 border-orange-400"><span class="text-5xl font-black text-orange-700">3</span></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t py-6 px-10 flex justify-end gap-4 shadow-lg z-50 shrink-0">
        <button id="btnStart" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xl py-4 px-12 rounded-2xl shadow-lg transition-all active:scale-95">Etkinliği Başlat</button>
        <button id="btnShowScores" class="hidden bg-gray-800 hover:bg-black text-white font-bold text-xl py-4 px-12 rounded-2xl shadow-lg animate-bounce">Puan Durumu</button>
        <button id="btnFinalScores" class="hidden bg-gray-800 hover:bg-black text-white font-bold text-xl py-4 px-12 rounded-2xl shadow-lg">Tüm Puan Durumu</button>
        <button id="btnEndEvent" class="hidden bg-red-600 hover:bg-red-700 text-white font-bold text-xl py-4 px-12 rounded-2xl shadow-lg">Kapanışı Yap</button>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onChildAdded, update, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const questions = [
            { text: "API (Uygulama Programlama Arayüzü) kavramı en doğru şekilde neye benzetilmiştir?", options: ["Bir köprü", "Bir veritabanı", "Bir kullanıcı ekranı", "Bir işletim sistemi"], correctAnswer: 0, timeLimit: 10 },
            { text: "Gemini API'nin 'Çok Modluluk' (Multimodal) özelliği ne anlama gelmektedir?", options: ["Sadece C# dilinde kullanılabilmesi", "İnternet bağlantısı olmadan çalışabilmesi", "Aynı anda metin, kod, görsel, ses ve videoyu işleyebilmesi", "Sadece çok hızlı metin yazabilmesi"], correctAnswer: 2, timeLimit: 10}, 
            { text: "Butona kodda erişmek ve onu diğer butonlardan ayırt etmek için hangi özelliği değiştirmemiz gerekir?", options: ["Text", "Name", "Tag", "Enabled"], correctAnswer: 1, timeLimit: 10 },
            { text: "Form1 sınıfı içerisinde sistemin otomatik tanımladığı ve elle müdahalenin tavsiye edilmediği metodun ismi nedir?", options: ["Form1_Load()", "Main()", "InitializeComponent()", "Dispose()"], correctAnswer: 2, timeLimit: 15 },
            { text: "API'lerden veri çekerken günümüzde en yaygın kullanılan 'anahtar-değer' (key-value) formatı aşağıdakilerden hangisidir?", options: ["HTML", "XML", "JSON", "YAML"], correctAnswer: 2, timeLimit: 10 },
            { text: "MVC proje yapısında, HomeController tarafından yönetilen yeni bir web sayfası (sekme) oluşturmak istediğimizde, bu sayfanın arayüz (.cshtml) dosyasını Views klasörü altındaki hangi dizine eklemeliyiz?", options: ["Shared", "Models", "wwwroot", "Home"], correctAnswer: 3, timeLimit: 20 },
            { text: "AI Studio sunucularında uygulamamızı yetkilendirmek için kullandığımız benzersiz kimlik hangisidir?", options: ["HTTP Header", "JSON Şeması", "Endpoint URL", "API Key"], correctAnswer: 3, timeLimit: 15 },
            { text: "Yapay zekadan yanıt beklerken arayüzün (UI) donmasını engelleyen C# kod yapısı hangisidir?", options: ["Async / Await", "Senkron Yürütme", "For Döngüsü", "Veritabanı İndeksi"], correctAnswer: 0, timeLimit: 15 }
        ];

        const firebaseConfig = { apiKey: "AIzaSyAGHg8ER6pybY4U4taMqrdxlf1ORXQdza4", authDomain: "gdg-yarismasi.firebaseapp.com", databaseURL: "https://gdg-yarismasi-default-rtdb.europe-west1.firebasedatabase.app", projectId: "gdg-yarismasi", storageBucket: "gdg-yarismasi.firebasestorage.app", messagingSenderId: "716447665178", appId: "1:716447665178:web:895ed3bb8ea73a030ed5a3" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gamePin = Math.floor(1000 + Math.random() * 9000).toString();

        let currentQuestionIndex = 0;
        let playerCount = 0;

        document.getElementById('displayPin').innerText = gamePin;
        document.getElementById('headerPin').innerText = gamePin;
        const roomRef = ref(db, 'rooms/' + gamePin);
        set(roomRef, { status: 'waiting' });

        const playersRef = ref(db, `rooms/${gamePin}/players`);
        onValue(playersRef, (snap) => { playerCount = snap.size; document.getElementById('playerCountTag').innerText = playerCount + " Kişi"; });
        onChildAdded(playersRef, (snap) => {
            const div = document.createElement('div');
            div.className = "bg-gray-100 text-gray-700 px-4 py-2 rounded-xl font-bold text-sm shadow-sm border animate-pop flex-grow text-center";
            div.innerText = snap.val().name;
            document.getElementById('playerList').appendChild(div);
        });

        document.getElementById('btnStart').addEventListener('click', () => {
            if(playerCount === 0) { alert("Lobi boş!"); return; }
            if(currentQuestionIndex >= questions.length) { showWinnerScreen(); return; }
            document.getElementById('lobbyArea').classList.add('hidden');
            document.getElementById('scoreboardArea').classList.add('hidden');
            document.getElementById('btnStart').classList.add('hidden');
            resetStyles();
            update(roomRef, { status: 'reading', currentQuestion: currentQuestionIndex }).then(() => { startCountdown(); });
        });

        document.getElementById('btnShowScores').addEventListener('click', () => {
            document.getElementById('questionArea').classList.add('hidden');
            document.getElementById('btnShowScores').classList.add('hidden');
            document.getElementById('scoreboardArea').classList.remove('hidden');
            const b = document.getElementById('btnStart');
            if(currentQuestionIndex >= questions.length) { b.innerText = "🏆 Kürsüyü Göster!"; b.classList.replace('bg-blue-600', 'bg-yellow-500'); }
            else { b.innerText = "Sıradaki Soru"; }
            b.classList.remove('hidden');
            loadScoreboard(5);
        });

        document.getElementById('btnFinalScores').addEventListener('click', () => {
            document.getElementById('winnerArea').classList.add('hidden');
            document.getElementById('btnFinalScores').classList.add('hidden');
            document.getElementById('scoreboardArea').classList.remove('hidden');
            loadScoreboard(100);
            document.getElementById('btnEndEvent').classList.remove('hidden');
        });

        document.getElementById('btnEndEvent').addEventListener('click', () => {
            document.getElementById('btnEndEvent').classList.add('hidden');
            update(roomRef, { status: 'closed' });
            document.getElementById('curtainLeft').style.width = '50%';
            document.getElementById('curtainRight').style.width = '50%';
            setTimeout(() => { document.getElementById('curtainContent').classList.remove('opacity-0'); confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, zIndex: 1000 }); }, 1000);
        });

        function startCountdown() {
            const q = questions[currentQuestionIndex];
            document.getElementById('questionArea').classList.remove('hidden');
            document.getElementById('questionText').innerText = q.text;
            for(let i=0; i<4; i++) document.getElementById('opt'+i).innerText = ["A) ", "B) ", "C) ", "D) "][i] + q.options[i];
            let prep = 5;
            const timer = document.getElementById('timerText');
            const circle = document.getElementById('timerCircle');
            circle.style.borderColor = "#EA4335";
            const prepTimer = setInterval(() => { timer.innerText = prep; if(prep <= 0) { clearInterval(prepTimer); startAnswering(timer, circle); } prep--; }, 1000);
        }

        function startAnswering(timer, circle) {
            update(roomRef, { status: 'answering' });
            let time = questions[currentQuestionIndex].timeLimit;
            circle.style.borderColor = "#34A853";
            const ansTimer = setInterval(() => { timer.innerText = time; if(time <= 0) { clearInterval(ansTimer); finish(); } time--; }, 1000);
            const unsub = onValue(playersRef, (snap) => {
                let count = 0;
                snap.forEach(c => { if(c.val().currentAnswer !== -1) count++; });
                if(count >= playerCount && playerCount > 0) { clearInterval(ansTimer); unsub(); finish(); }
            });
        }

        async function finish() {
            update(roomRef, { status: 'finished' });
            const correct = questions[currentQuestionIndex].correctAnswer;

            const snap = await get(playersRef);
            let counts = [0, 0, 0, 0];
            let updates = {};

            snap.forEach(playerSnap => {
                const p = playerSnap.val();
                const pKey = playerSnap.key;
                if (p.currentAnswer !== undefined && p.currentAnswer !== -1) {
                    counts[p.currentAnswer]++;
                    if (p.currentAnswer === correct) {
                        const eskiPuan = p.score || 0;
                        updates[`${pKey}/score`] = eskiPuan + 1000;
                    }
                }
                updates[`${pKey}/currentAnswer`] = -1;
            });

            if (Object.keys(updates).length > 0) {
                await update(playersRef, updates);
            }

            for(let i=0; i<4; i++) {
                const b = document.getElementById('box'+i);
                const cBox = document.getElementById('count'+i);
                cBox.innerText = counts[i] + " Kişi";
                cBox.classList.remove('hidden');
                if(i === correct) {
                    b.classList.add('ring-8', 'ring-blue-200', 'scale-105');
                    cBox.className = "text-gray-800 text-3xl font-black bg-white px-5 py-2 rounded-2xl";
                } else {
                    b.classList.add('opacity-40', 'grayscale');
                }
            }

            currentQuestionIndex++;
            document.getElementById('btnShowScores').classList.remove('hidden');
        }

        async function loadScoreboard(limit) {
            const snap = await get(playersRef);
            let players = []; snap.forEach(c => players.push(c.val()));
            players.sort((a,b) => (b.score || 0) - (a.score || 0));
            const list = document.getElementById('scoreList');
            list.innerHTML = "";
            players.slice(0, limit).forEach((p, i) => {
                list.innerHTML += `<div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl border shadow-sm animate-pop">
                    <span class="text-xl font-bold"><span class="text-blue-600 mr-3">#${i+1}</span> ${p.name}</span>
                    <span class="text-2xl font-black text-blue-600">${p.score || 0}</span></div>`;
            });
        }

        function resetStyles() {
            for(let i=0; i<4; i++) {
                const b = document.getElementById('box'+i);
                b.classList.remove('ring-8', 'ring-blue-200', 'scale-105', 'opacity-40', 'grayscale');
                const cBox = document.getElementById('count'+i);
                cBox.classList.add('hidden'); cBox.className = "hidden text-white text-3xl font-black bg-black/20 px-5 py-2 rounded-2xl";
            }
        }

        async function showWinnerScreen() {
            update(roomRef, { status: 'game_over' });
            document.getElementById('scoreboardArea').classList.add('hidden');
            document.getElementById('winnerArea').classList.remove('hidden');
            const snap = await get(playersRef);
            let players = []; snap.forEach(c => players.push(c.val()));
            players.sort((a,b) => (b.score || 0) - (a.score || 0));
            if(players.length > 0) {
                document.getElementById('name1').innerText = players[0].name;
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                setTimeout(() => {
                    if(players[1]) { document.getElementById('name2').innerText = players[1].name; document.getElementById('place2').classList.remove('hidden'); }
                    if(players[2]) { document.getElementById('name3').innerText = players[2].name; document.getElementById('place3').classList.remove('hidden'); }
                    setTimeout(() => document.getElementById('btnFinalScores').classList.remove('hidden'), 2000);
                }, 4000);
            }
        }
    </script>
</body>
</html>
