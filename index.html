<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AWS Cloud Quiz</title>
    <!-- AWS Kulübü logonu buraya eklemeyi unutma -->
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .animate-pop { animation: pop 0.25s ease-out forwards; }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        /* AWS'in Koyu Lacivert ve Turuncu Gradyanı */
        .aws-gradient { background: linear-gradient(135deg, #232F3E 0%, #FF9900 100%); }
    </style>
</head>
<body class="bg-gray-100 h-screen font-sans overflow-hidden text-gray-800">
    
    <div id="loginScreen" class="h-full flex items-center justify-center p-4">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-sm text-center border relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-3 aws-gradient"></div>
            <img src="logo.png" class="h-20 w-auto mx-auto mb-6 mt-4 object-contain">
            <p class="text-3xl font-bold text-gray-800 mb-6">AWS Cloud <span class="text-[#FF9900]">Kulübü</span></p>
            <div class="space-y-6">
                <input type="number" id="gamePin" placeholder="PIN" class="w-full text-center text-2xl font-bold p-5 border-2 border-gray-200 rounded-2xl outline-none focus:border-[#FF9900] transition-colors">
                <input type="text" id="playerName" placeholder="Adın" class="w-full text-center text-2xl font-bold p-5 border-2 border-gray-200 rounded-2xl outline-none focus:border-[#FF9900] transition-colors">
                <!-- Buton rengi AWS laciverti yapıldı -->
                <button onclick="joinGame()" class="w-full bg-[#232F3E] text-white font-bold text-2xl py-5 rounded-2xl shadow-lg active:scale-95 transition-transform hover:bg-[#131A22]">Katıl</button>
            </div>
        </div>
    </div>

    <div id="infoScreen" class="hidden h-full flex flex-col items-center justify-center p-6 text-center">
        <div id="infoContent" class="flex flex-col items-center w-full"></div>
    </div>

    <!-- Cevap butonlarının renkleri Host ekranındaki kutularla birebir eşleştirildi -->
    <div id="buttonScreen" class="hidden h-full p-2 grid grid-cols-2 grid-rows-2 gap-2">
        <button onclick="sendAnswer(0)" class="bg-[#D13212] rounded-[2rem] shadow-lg border-b-8 border-[#8B220C] active:opacity-60"></button>
        <button onclick="sendAnswer(1)" class="bg-[#0073BB] rounded-[2rem] shadow-lg border-b-8 border-[#004B7A] active:opacity-60"></button>
        <button onclick="sendAnswer(2)" class="bg-[#FF9900] rounded-[2rem] shadow-lg border-b-8 border-[#B36B00] active:opacity-60"></button>
        <button onclick="sendAnswer(3)" class="bg-[#1D8102] rounded-[2rem] shadow-lg border-b-8 border-[#114A01] active:opacity-60"></button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // AWS Kulübü için oluşturduğun YENİ Firebase Projesi (awsyarisma) ayarları
        const firebaseConfig = { 
            apiKey: "AIzaSyC4hV79TLWMl44QhndnKlzdgq46KDxo86k", 
            authDomain: "awsyarisma.firebaseapp.com", 
            databaseURL: "https://awsyarisma-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "awsyarisma", 
            storageBucket: "awsyarisma.firebasestorage.app", 
            messagingSenderId: "936537536470", 
            appId: "1:936537536470:web:448e05d32c44b9919f5677",
            measurementId: "G-FHEXVWS896"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myKey = "", currentPin = "", hasAnswered = false;

        window.joinGame = function() {
            const pin = document.getElementById('gamePin').value;
            const name = document.getElementById('playerName').value;
            if(pin && name) {
                currentPin = pin;
                const pRef = push(ref(db, `rooms/${pin}/players`));
                myKey = pRef.key;
                set(pRef, { name: name, score: 0, currentAnswer: -1 }).then(() => {
                    document.getElementById('loginScreen').classList.add('hidden');
                    updateUI('connected');
                    listenRoom(pin);
                });
            }
        }

        function updateUI(status) {
            const info = document.getElementById('infoScreen');
            const btns = document.getElementById('buttonScreen');
            const content = document.getElementById('infoContent');

            btns.style.display = (status === 'answering') ? 'grid' : 'none';
            info.style.display = (status === 'answering') ? 'none' : 'flex';

            // Ekran arka planları AWS konseptine uyarlandı
            if(status === 'connected' || status === 'reading') {
                info.className = "h-full flex flex-col items-center justify-center p-6 bg-[#232F3E] text-center";
                content.innerHTML = `<img src="logo.png" class="h-28 w-auto mb-8 bg-white p-4 rounded-3xl animate-pop"><h2 class="text-4xl font-black text-white">Bağlandın!<br><span class="text-2xl text-[#FF9900] opacity-90 mt-2 block">Ekrana Bak...</span></h2>`;
            } else if(status === 'answered') {
                info.className = "h-full flex flex-col items-center justify-center p-6 bg-[#1D8102] text-center";
                content.innerHTML = `<div class="bg-white p-5 rounded-[2rem] shadow-2xl mb-8 animate-pop"><img src="logo.png" class="h-24 w-auto"></div><h2 class="text-4xl font-black text-white">Cevabın Alındı!</h2><p class="text-2xl text-green-100 mt-2 font-bold">Şimdi ana ekrana bak...</p>`;
            } else if(status === 'finished') {
                info.className = "h-full flex flex-col items-center justify-center p-6 bg-[#131A22] text-center";
                content.innerHTML = `<h2 class="text-4xl font-black text-white">Süre Bitti!<br><span class="text-gray-400 text-2xl font-bold mt-2 block">Ekrana Bak</span></h2>`;
            }
        }

        function listenRoom(pin) {
            onValue(ref(db, `rooms/${pin}`), (snap) => {
                const data = snap.val(); if(!data) return;
                if(data.status === 'reading') {
                    hasAnswered = false; 
                    update(ref(db, `rooms/${currentPin}/players/${myKey}`), { currentAnswer: -1 });
                    updateUI('reading');
                } else if(data.status === 'answering') {
                    if(!hasAnswered) updateUI('answering');
                } else if(data.status === 'finished') {
                    updateUI('finished');
                } else if(data.status === 'game_over') {
                    get(ref(db, `rooms/${currentPin}/players`)).then(pSnap => {
                        let players = []; pSnap.forEach(c => players.push({key:c.key, ...c.val()}));
                        players.sort((a,b) => b.score - a.score);
                        let rank = players.findIndex(p => p.key === myKey) + 1;
                        const info = document.getElementById('infoScreen');
                        const content = document.getElementById('infoContent');
                        document.getElementById('buttonScreen').style.display = 'none';
                        info.style.display = 'flex';
                        if(rank === 1) { 
                            info.className = "h-full flex flex-col items-center justify-center bg-[#FF9900] text-center animate-pulse"; 
                            content.innerHTML = `<h2 class="text-6xl font-black text-[#232F3E]">🏆 BİRİNCİSİN!</h2>`; 
                        }
                        else { 
                            info.className = "h-full flex flex-col items-center justify-center bg-[#232F3E] text-center"; 
                            content.innerHTML = `<h2 class="text-white text-4xl font-black">Oyun Bitti!<br><span class="text-[#FF9900] text-6xl mt-4 block">${rank}. oldun</span></h2>`; 
                        }
                    });
                } else if(data.status === 'closed') {
                    updateUI('closed');
                    const info = document.getElementById('infoScreen');
                    info.className = "h-full flex flex-col items-center justify-center bg-[#131A22] text-center";
                    document.getElementById('infoContent').innerHTML = `<span class='text-3xl font-black text-white mb-8 block'>Teşekkürler!</span><div class="bg-white p-4 rounded-3xl w-48 mx-auto mb-4"><img src="logo.png" class="w-full h-auto object-contain"></div><span class='text-xl font-bold text-[#FF9900]'>AWS Cloud Kulübü</span>`;
                }
            });
        }

        window.sendAnswer = function(idx) {
            if(hasAnswered) return; hasAnswered = true;
            updateUI('answered'); 
            update(ref(db, `rooms/${currentPin}/players/${myKey}`), { currentAnswer: idx });
        }
    </script>
</body>
</html>
